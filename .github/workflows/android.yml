name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, test and lint
        run: ./gradlew --no-daemon --console=plain -PrenderBoard assembleDebug testDebugUnitTest lintDebug
      - name: Validate release rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScheduleBoard-checks-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/

  release:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: signed-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_release.py
      - uses: actions/setup-java@v6
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        if: steps.version.outputs.publish == 'true'
      - name: Install Android SDK packages
        if: steps.version.outputs.publish == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Restore fixed signing identity
        if: steps.version.outputs.publish == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo '::error::Configure ANDROID_SIGNING_KEYSTORE_BASE64 in repository Actions secrets. Never publish with a random signing key.'
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scheduleboard.keystore"
      - name: Build signed release
        if: steps.version.outputs.publish == 'true'
        env:
          SCHEDULEBOARD_KEYSTORE: ${{ runner.temp }}/scheduleboard.keystore
        run: ./gradlew --no-daemon --console=plain assembleRelease lintRelease
      - name: Verify signing certificate and package assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p release-assets
          apk="release-assets/ScheduleBoard-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > release-assets/SIGNATURE.txt
          python3 scripts/verify_signing.py release-assets/SIGNATURE.txt
          cp release-notes.md "release-assets/RELEASE-NOTES-$VERSION.md"
          (cd release-assets && sha256sum "ScheduleBoard-$VERSION.apk" "RELEASE-NOTES-$VERSION.md" SIGNATURE.txt > SHA256SUMS.txt)
      - name: Publish downloadable APK release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/publish_release.py
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/scheduleboard.keystore"
