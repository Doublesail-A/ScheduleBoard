name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, test and lint
        run: ./gradlew --no-daemon --console=plain -PrenderBoard assembleDebug testDebugUnitTest lintDebug
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ScheduleBoard-debug-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
